<svg viewBox="0 0 320 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lux" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#ff9a5a"/>
    </linearGradient>
  </defs>

  <!-- Circle -->
  <circle cx="50" cy="50" r="30"
          stroke="url(#lux)" stroke-width="2" fill="none"/>

  <!-- Stylish LW -->
